<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #fef6f9, #f0f9ff);
        }
    
    .flash-message {
        animation: fadeOut 0.5s ease forwards;
        animation-delay: 4s; /* wait 4 seconds before disappearing */
    }

    @keyframes fadeOut {
        to {
            opacity: 0;
            visibility: hidden;
        }
    }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-5 mx-auto" style="max-width: 400px;">

        <h3 class="text-center mb-4">Login</h3>

        <!-- FLASH MESSAGES -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} flash-message">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Login As</label>
                <select name="role" class="form-select" required>
                    <option value="admin">Admin</option>
                    <option value="student">Student</option>
                    <option value="company">Company</option>
                </select>
            </div>

            <button class="btn btn-dark w-100">Login</button>
            
        </form>
            <p class="text-center mt-3">
    don't have an account? 
    <a href="/home" class="text-primary">Home</a>
</p>
    </div>

</div>

</body>
</html>
