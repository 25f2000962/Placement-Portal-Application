<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #fef6f9, #f0f9ff);
        }
        
.alert {
    animation: fadeOut 5s ease forwards;
}

@keyframes fadeOut {
    0% {
        opacity: 1;
    }
    80% {
        opacity: 1;
    }
    100% {
        opacity: 0;
        visibility: hidden;
    }
}

    </style>
</head>

<body>

<div class="d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4 rounded-4" style="width: 22rem;">

        <h4 class="text-center mb-3">Student Register</h4>
        {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} text-center">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}
        <form method="POST" enctype="multipart/form-data">

            <div class="form-floating mb-3">
                <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                <label>Full Name</label>
            </div>

            <div class="form-floating mb-3"> 
                <input type="email" name="email" class="form-control" placeholder="email" required>
                <label>Email</label>
            </div>

            <div class="form-floating mb-3">
                <input type="text" name="phone" class="form-control" placeholder="phone" required>
                <label>Mobile</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" name="password" class="form-control" placeholder="password" required>
                <label>Password</label>
            </div>
                <p class="text-center mt-3">
    Already have an account? 
    <a href="/login" class="text-primary">Login</a>
</p>
            <button class="btn btn-primary w-100 mt-2">Register</button>
            
        </form>

    </div>

</div>

</body>
</html>
