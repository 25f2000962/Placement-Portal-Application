<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Drive</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-dark text-white">
    <div class="container-fluid">
        <a class="navbar-brand text-white" href="#">Placement Portal</a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item text-white">
                    <a class="nav-link text-white" href="/company/dashboard">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="/logout">Logout</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- Form -->
<div class="d-flex justify-content-center">
    <div class="card mt-5" style="width:30rem">
        <div class="card-body">

            <h5 class="card-title">Create Placement Drive</h5>

            <form method="POST" action="/company/create-drive">

                <div class="mb-3">
                    <label class="form-label">Job Title</label>
                    <input type="text" name="title" class="form-control" placeholder="Enter job title" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Job Description</label>
                    <textarea name="description" class="form-control" rows="3" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Eligibility Criteria</label>
                    <input type="text" name="eligibility" class="form-control" placeholder="e.g. B.Tech, 60%" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Application Deadline</label>
                    <input type="date" name="deadline" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Package (Optional)</label>
                    <input type="int" name="package" class="form-control" placeholder="Enter salary package">
                </div>

                <button type="submit" class="btn btn-primary w-100">Create Drive</button>

            </form>

        </div>
    </div>
</div>

</body>
</html>
