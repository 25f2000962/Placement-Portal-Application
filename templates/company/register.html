<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Company Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #fef6f9, #f0f9ff);
        }
        
.alert {
    animation: fadeOut 5s ease forwards;
}

@keyframes fadeOut {
    0% {
        opacity: 1;
    }
    80% {
        opacity: 1;
    }
    100% {
        opacity: 0;
        visibility: hidden;
    }
}

    </style>
</head>

<body>

<div class="d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4 rounded-4" style="width: 22rem;">

        <h4 class="text-center mb-3">Company Register</h4>
        
        <form method="POST">

            <div class="form-floating mb-3">
                <input type="text" name="company_name" class="form-control" placeholder="Company Name" required>
                <label>Company Name</label>
            </div>


            <div class="form-floating mb-3">
                <input type="email" name="email" class="form-control" placeholder="Email" required>
                <label>Email</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
                <label>Password</label>
            </div>
            <div class="form-floating mb-3">
    <input type="text" 
           name="hr_contact" 
           class="form-control" 
           placeholder="9876543210"
           pattern="[0-9]{10}" 
           required>
    <label>HR Contact</label>
</div>

<!-- ✅ WEBSITE -->
<div class="form-floating mb-3">
    <input type="url" 
           name="website" 
           class="form-control" 
           placeholder="https://example.com" 
           required>
    <label>Website</label>
</div>
            
            <button class="btn btn-primary w-100 mt-2">Register</button>
<p class="text-center mt-3">
    Already have an account? 
    <a href="/login" class="text-primary">Login</a>
</p>
        </form>
        {% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="alert alert-{{ category }} text-center">
      {{ message }}
    </div>
  {% endfor %}
{% endwith %}

    </div>

</div>

</body>
</html>
