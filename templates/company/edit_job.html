<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Drive</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Placement Portal</a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/company/dashboard">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- Form -->
<div class="d-flex justify-content-center">
    <div class="card mt-5" style="width:30rem">
        <div class="card-body">

            <h5 class="card-title">Edit Placement Drive</h5>

            <!-- IMPORTANT: no action needed (same route handles POST) -->
            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Job Title</label>
                    <input type="text" name="title" class="form-control"
                           value="{{ job.title }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Job Description</label>
                    <textarea name="description" class="form-control" rows="3" required>{{ job.description }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Eligibility Criteria</label>
                    <input type="text" name="eligibility" class="form-control"
                           value="{{ job.eligibility }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Application Deadline</label>
                    <input type="date" name="deadline" class="form-control"
                           value="{{ job.deadline }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Package (Optional)</label>
                    <input type="text" name="package" class="form-control"
                           value="{{ job.package }}">
                </div>

                <button type="submit" class="btn btn-success w-100">Update Drive</button>

            </form>

        </div>
    </div>
</div>

</body>
</html>
