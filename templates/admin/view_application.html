<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Applications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">
    <nav class="navbar bg-dark navbar-expand-lg">
    <div class="container-fluid">

        <a class="navbar-brand">Admin Panel</a>

        <!-- SEARCH -->
        <form class="d-flex" action="/admin/search" method="GET">
            
            <button class="btn btn-light">Search</button>
        </form>
        <a href="/admin/dashboard" class="btn btn-light me-2">Dashboard</a>
        <!-- LOGOUT -->
        <a href="/logout" class="btn btn-danger ms-3">Logout</a>

    </div>
</nav>

    <h3>Applications for {{ drive.title }}</h3>

    <table class="table table-bordered mt-3">
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Resume</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            {% for app in applications %}
            <tr>
                <td>{{ app.student.name }}</td>
                <td>{{ app.student.email }}</td>
                <td>{{ app.student.phone }}</td>

                <td>
                    <a href="/{{ app.student.resume }}" target="_blank">
                        View Resume
                    </a>
                </td>

                <td>{{ app.status }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
